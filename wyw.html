<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>King of the Hill</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/default.css">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon.png">
  <meta name="apple-mobile-web-app-title" content="Blue Flash">
  <link rel="stylesheet" href="css/mobile.css">
  <link rel="stylesheet" href="css/wyw.css">
</head>

<body>
  <h1>King of the Hill</h1>
  <div class="navLinks"></div>
  <div class="mode-toggle">
    <div class="select-wrap">
      <select class="dropdown" data-role="single"></select>
    </div>
  </div>
  <div id="game">
    <div class="choices"></div>
  </div>
  <div id="helpWrapper">
    <button id="helpBtn">?</button>
    <div id="helpTooltip">
      <strong>How to Play</strong><br><br>
      • Choose who stays on the hill<br>
      • The loser is eliminated<br>
      • A new challenger appears each round<br>
      • Last one standing wins
    </div>
  </div>
  <script src="js/default.js"></script>
  <script src="js/wyw.js"></script>
  <script src="js/mobile.js"></script>
</body>

</html>
